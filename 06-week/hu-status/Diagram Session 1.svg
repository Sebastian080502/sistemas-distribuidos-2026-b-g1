  <rect x="660" y="600" width="570" height="110" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="945" y="645" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">RabbitMQ :5672</text>
  <text x="945" y="675" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#475569">eventos (no pasan por el gateway)</text>
  <text x="40" y="830" font-family="Segoe UI, sans-serif" font-size="15" fill="#475569">Dentro de la red: http://space-service:8082 nunca localhost. Volúmenes con nombre. depends_on + healthcheck (pg_isready).</text>
  <text x="40" y="860" font-family="Segoe UI, sans-serif" font-size="15" fill="#475569">Este fork solo documenta. El profesor crea un repo por microservicio. Compose no vive en el fork del curso.</text>
