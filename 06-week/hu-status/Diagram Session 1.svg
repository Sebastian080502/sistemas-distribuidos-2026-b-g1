<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="40" y="48" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#0f172a">SpaceHub / DRP · Semana 6 sesión 1 · Docker Compose</text>
  <text x="40" y="80" font-family="Segoe UI, sans-serif" font-size="16" fill="#475569">Red compartida spacehub-net · un PostgreSQL por contexto · DNS por nombre de servicio</text>
  <rect x="40" y="110" width="1520" height="670" rx="18" fill="#fff" stroke="#0f766e" stroke-width="3"/>
  <text x="64" y="145" font-family="Segoe UI, sans-serif" font-size="15" fill="#0f766e">network: spacehub-net · docker compose up · Compose: Q-004 (lo asigna el profesor)</text>
  <rect x="80" y="170" width="280" height="85" rx="12" fill="#0f766e"/>
  <text x="220" y="205" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#fff">web-app :4200</text>
  <text x="220" y="230" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#ecfdf5">Angular USER + ADMIN</text>
  <rect x="500" y="170" width="360" height="85" rx="12" fill="#1e293b"/>
  <text x="680" y="205" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#fff">api-gateway :8080</text>
  <text x="680" y="230" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">Go · JWT · routing</text>
  <line x1="360" y1="212" x2="500" y2="212" stroke="#0f766e" stroke-width="3"/>
  <polygon points="500,212 486,206 486,218" fill="#0f766e"/>
  <g font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0f172a">
    <rect x="80" y="340" width="270" height="85" rx="12" fill="#fff" stroke="#334155"/><text x="215" y="375" text-anchor="middle">identity-service</text><text x="215" y="400" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">:8081</text>
    <rect x="370" y="340" width="270" height="85" rx="12" fill="#fff" stroke="#334155"/><text x="505" y="375" text-anchor="middle">space-service</text><text x="505" y="400" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">:8082</text>
    <rect x="660" y="340" width="270" height="85" rx="12" fill="#fff" stroke="#334155"/><text x="795" y="375" text-anchor="middle">reservation-service</text><text x="795" y="400" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">:8083</text>
    <rect x="950" y="340" width="270" height="85" rx="12" fill="#fff" stroke="#334155"/><text x="1085" y="375" text-anchor="middle">payment-service</text><text x="1085" y="400" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">:8084</text>
    <rect x="1240" y="340" width="270" height="85" rx="12" fill="#fff" stroke="#0f766e"/><text x="1375" y="375" text-anchor="middle">notification-service</text><text x="1375" y="400" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">:8085</text>
  </g>
  <g fill="#e2e8f0" stroke="#334155">
    <rect x="80" y="470" width="270" height="75" rx="12"/><rect x="370" y="470" width="270" height="75" rx="12"/><rect x="660" y="470" width="270" height="75" rx="12"/><rect x="950" y="470" width="270" height="75" rx="12"/><rect x="1240" y="470" width="270" height="75" rx="12"/>
