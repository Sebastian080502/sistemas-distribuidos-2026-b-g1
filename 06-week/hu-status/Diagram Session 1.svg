    <text x="215" y="500">PostgreSQL</text><text x="215" y="522" fill="#475569">identity_pg_data</text>
    <text x="505" y="500">PostgreSQL</text><text x="505" y="522" fill="#475569">space_pg_data</text>
    <text x="795" y="500">PostgreSQL</text><text x="795" y="522" fill="#475569">reservation_pg_data</text>
    <text x="1085" y="500">PostgreSQL</text><text x="1085" y="522" fill="#475569">payment_pg_data</text>
