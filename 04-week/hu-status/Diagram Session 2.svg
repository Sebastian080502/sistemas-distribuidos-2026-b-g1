  <rect x="30" y="60" width="160" height="50" fill="#fff" stroke="#334155"/><text x="110" y="90" text-anchor="middle" font-size="12" font-family="Segoe UI, sans-serif">HTTP</text>
  <rect x="30" y="130" width="160" height="50" fill="#fff" stroke="#334155"/><text x="110" y="160" text-anchor="middle" font-size="12" font-family="Segoe UI, sans-serif">application</text>
